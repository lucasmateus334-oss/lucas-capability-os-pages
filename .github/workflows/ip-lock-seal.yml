name: IP deterministic lock seal

on:
  push:
    branches:
      - governance/ip-lock-seal-v1
    paths:
      - package.json
      - .github/workflows/ip-lock-seal.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Resolve deterministic lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate lock with npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Persist package-lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock already deterministic'
            exit 0
          fi
          git commit -m 'chore: persist deterministic public package lock' -m 'O que isso faz: fixa a árvore Node usada pelo site público para que CI, deploy e auditoria jurídica resolvam o mesmo grafo.'
          git push origin "HEAD:${GITHUB_REF_NAME}"

# O que isso faz: cria e valida o package-lock do site público sem alterar a main diretamente.
