name: Relay Zero-Cost Owner Pilot Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay-zero-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build static site
        run: npm run build

      - name: Verify static privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/relay/index.html
          test -f dist/relay/app.js
          grep -q "connect-src 'none'" dist/relay/index.html
          grep -q 'PBKDF2_ITERATIONS = 250000' dist/relay/app.js
          grep -q "AES-GCM" dist/relay/app.js
          grep -q "localStorage" dist/relay/app.js
          grep -q "https://wa.me/" dist/relay/app.js
          ! grep -q '5511996673607' dist/relay/app.js
          ! grep -q '5511996673607' dist/relay/index.html
          echo 'RELAY_ZERO_COST_STATIC_BOUNDARY_PASS'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Relay encrypted self-binding E2E
        run: npm run test:relay

# O que isso faz: impede promoção do piloto estático se o número aparecer no código público ou se o fluxo criptografado deixar de funcionar em navegador real.
